<!DOCTYPE html> <!---- descreve a linguagem de programacao que vai ser utilizada. Nesse caso o HTML-->
<html lang="pt-br"> <!-- inicio do documento -->
<head> <!--define o cabecalho do documento. O conteudo do descrito aqui nao aparece-->
    <meta charset="UTF-8"> <!-- indica quis serao os caracteres (character set ou charset) sera utilizados para o texto da pagina  -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--fornece os metadados do site para o navegador-->
    <title>Document</title>
</head>  <!--fechamento do cabecalho do documento-->
<body> <!--e o espaco em que todas as tags devem ser colocadas.O conteudo aqui contido e o visual da pagina. As tags que representam textos, botoes e outros devem ser adicionados -->
<!--um documento html e composto por tags que sao escritas entre <>. as tags precisam ser abertas e fechadas, o que as diferenciam é que as tags de fechamento possuem uma \ antes do nome.-->    
</body>
</html> <!-- fim do documento-->
